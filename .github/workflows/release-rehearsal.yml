# A release rehearsed (R190 step 2): every step a release's tag runs, on a
# branch, publishing nothing. The 0.9.0 dev release spent about ten tags on
# an OS image that would not boot, since only a tag built the whole set (the
# operator, 30 Oct), and v0.9.0-dev.6049 died twice on steps only a tag ran;
# this runs them from `aerie version rehearse` or the Actions page, so a
# release is tagged once it is green here. `aerie version rehearse` first
# commits the changelog's section for the dev build and pushes it, so this
# runs on the commit the release will tag.
#
# What it runs, as a tag's run does and with the same tools:
# - the agent signed (tools/sign-agent.py) with a key made in the job and
#   thrown away with it, and its spare, then checked against that key's
#   public half and refused by the committed one;
# - the container image built from this commit with that agent in it, by
#   the tag's own build step but pushed nowhere, then started on each
#   release's /config (tools/upgrade-image.sh) and its root tier run in the
#   image itself (tools/root-tier.sh), as a tag's run does after its push;
# - the controller bundle packed (tools/release-pack.sh) with the signature
#   and the commit's hash in it, and the notes a tag on this commit would be
#   made with (tools/release-notes.sh, at a tag made in this checkout alone);
# - the OS image built with the signed agent and booted (os-image.yml), the
#   Android APK built on the hosted runner a tag builds it on
#   (android-app.yml), and the companion's .pyz, .exe and the VS Code
#   extension built (companion-app.yml);
# - the three checks a tag is held to before anything is built to publish
#   (R206): where a release of each kind may be cut from, said for this
#   commit and never refused here; aerie lint with the unit tier; and every
#   browser suite;
# - the seal, dry (R199): the library the release key is used with,
#   installed from its hash-pinned list, and the list of the files this run
#   built made and signed by tools/release-sign.py seal with a key made in
#   the job, the Android app signed with one too and held to it by
#   apksigner, then verified by ssh-keygen and refused against the committed
#   file. The last job gathers what was built as a tag's last job does and
#   says which of the files a release must carry (.release-files) a release
#   from this commit would have and lack.
#
# What only a tag can prove stays unproved here: the release environment's
# approval and the key it holds; the build attestations and the transparency
# log they go to; the image's push, the line naming it by its digest, and
# the cache a push leaves; the Windows code signing; the controller signing
# the Android app and attaching it; the release made, sealed with the real
# key and published. It reads no secret and attaches nothing, and nothing it
# signs is taken by any install.
name: release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The agent signed as a tag's signature job signs it, with the same tool,
  # under a key made here: the key the builds sign with and its spare, in
  # the committed file's form, so the spare's statement is made as a
  # release's build makes it. The private half is on disk only while the
  # tool reads it; the public half goes to the jobs that check it.
  signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0
      - name: The pinned library the key is used with
        run: bash tools/release-lib.sh "$RUNNER_TEMP/release-lib"
      - name: Sign the agent with a key made for this run
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/release-lib
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/rehearsal-key"
          mkdir -p "$keys"
          python3 - "$keys/aerieos-release.pub" "$keys/seed" <<'PY'
          import os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key, spare = Ed25519PrivateKey.generate(), Ed25519PrivateKey.generate()
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              f.write("# a rehearsal's own keys, thrown away with its runner\n")
              for k in (key, spare):
                  f.write(f"aerieos-release-ed25519 {k.public_key().public_bytes_raw().hex()}\n")
          fd = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          os.write(fd, key.private_bytes_raw().hex().encode())
          os.close(fd)
          PY
          AERIEOS_RELEASE_KEY="$(cat "$keys/seed")" AERIEOS_RELEASE_PUB="$keys/aerieos-release.pub" python3 tools/sign-agent.py
          rm -f "$keys/seed"
          AERIEOS_RELEASE_PUB="$keys/aerieos-release.pub" python3 tools/sign-agent.py --check
          # ...and no install takes it: the committed key does not.
          if python3 tools/sign-agent.py --check > /dev/null; then
            echo "::error::a key made in this job signed an agent the committed release key takes"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2, pinned by commit (R206)
        with:
          name: agent-signature
          path: scripts/agent/agent.sig
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2, pinned by commit (R206)
        with:
          name: rehearsal-release-key
          path: ${{ runner.temp }}/rehearsal-key/aerieos-release.pub
          if-no-files-found: error
          retention-days: 1

  # The container image a tag pushes, built from this commit with the agent
  # signed above in it, by the tag's own build step but loaded here and
  # pushed nowhere (test_release_gate.py holds the two steps to each
  # other), then put through what a tag's run puts it through after its
  # push: started on each release's /config, and the root tier in the image
  # itself.
  image:
    needs: signature
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1, pinned by commit (R206)
      # For the cache a tag's build seeds from (:main): the package is
      # private, so even the read needs the run's own token, which may read
      # packages here and write none. No secret is read.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0, pinned by commit (R206)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive cache ref
        id: cache
        run: |
          echo "ref=$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):main" >> "$GITHUB_OUTPUT"
      - name: Stamp the build
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"
      - name: Derive the version
        id: ver
        run: |
          v="$(BB_RELAYED=1 bash scripts/aerie version --semver)" \
            || { echo "::error::aerie version did not say what this checkout is"; exit 1; }
          echo "built $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Take the agent's signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        with:
          name: agent-signature
          path: scripts/agent
      - name: Take this run's key
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        with:
          name: rehearsal-release-key
          path: ${{ runner.temp }}/rehearsal-key
      - name: The agent's signature, checked against this run's key
        shell: bash
        run: |
          bash tools/release-lib.sh "$RUNNER_TEMP/release-lib"
          AERIEOS_RELEASE_PUB="$RUNNER_TEMP/rehearsal-key/aerieos-release.pub" PYTHONPATH="$RUNNER_TEMP/release-lib" \
            python3 tools/sign-agent.py --check
      - name: Build, pushed nowhere
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0, pinned by commit (R206)
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            IMAGE_REV=${{ github.sha }}
            IMAGE_BUILT=${{ steps.stamp.outputs.at }}
            IMAGE_VERSION=${{ steps.ver.outputs.v }}
          push: false
          load: true
          tags: aerieos-rehearsal:${{ github.sha }}
          provenance: false
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
      - name: Start the image on each release's /config
        run: tools/upgrade-image.sh "aerieos-rehearsal:$GITHUB_SHA"
      - name: The root tier in the image itself
        run: tools/root-tier.sh "aerieos-rehearsal:$GITHUB_SHA"

  # The bundle packed and the notes written as a tag's bundle job packs and
  # writes them, with the agent signed above in it.
  bundle:
    needs: signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pack.outputs.version }}
      tag: ${{ steps.notes.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0
      - name: Take the agent's signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        with:
          name: agent-signature
          path: scripts/agent
      - name: Take this run's key
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        with:
          name: rehearsal-release-key
          path: ${{ runner.temp }}/rehearsal-key
      - name: The agent's signature, checked against this run's key
        shell: bash
        run: |
          bash tools/release-lib.sh "$RUNNER_TEMP/release-lib"
          AERIEOS_RELEASE_PUB="$RUNNER_TEMP/rehearsal-key/aerieos-release.pub" PYTHONPATH="$RUNNER_TEMP/release-lib" \
            python3 tools/sign-agent.py --check
      - name: Pack the tree as the release packs it
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          ver="$(BB_RELAYED=1 bash scripts/aerie version --file)"
          name="$(bash tools/release-pack.sh HEAD "$ver")"
          tar -tzf "$name" | grep -qx "builderbot-${ver}/scripts/agent/agent.sig" \
            || { echo "::error::the bundle carries no agent signature"; exit 1; }
          ls -l "$name"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The notes are read at the release's tag: one made in this checkout
      # alone, on this commit, by the name a dev build's release would give
      # it, and pushed nowhere.
      - name: Write the notes a tag on this commit would be made with
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          v="$(BB_RELAYED=1 bash scripts/aerie version --semver)"
          tag="v${v%%+*}"
          git tag -f "$tag" HEAD
          bash tools/release-notes.sh "$tag" "$GITHUB_REPOSITORY" > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::the notes for $tag are empty"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          { echo "## The notes $tag would be made with"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      # Handed to the last job as a tag's bundle is (build-image.yml).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2, pinned by commit (R206)
        with:
          name: release-bundle
          path: |
            ${{ steps.pack.outputs.name }}
            ${{ steps.pack.outputs.name }}.sha256
            notes.md
          if-no-files-found: error
          retention-days: 1

  apps:
    uses: ./.github/workflows/companion-app.yml
    with:
      hand-on: true
    # What the called workflow's jobs ask for (a job may not be granted
    # less than it names); with no tag it attaches nothing and attests
    # nothing.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Handed no secret: a rehearsal runs from any branch, so its .exe is
    # built as a release's is and left unsigned, which the build says. The
    # Windows certificate is a tag's run's alone.

  # On the hosted runner a tag's own run builds the APK on, so that build
  # is proved here and not first by a tag.
  android:
    uses: ./.github/workflows/android-app.yml
    with:
      hosted: true
      rehearse: true
    permissions:
      contents: read

  # With the agent signed above, as a tag's OS image carries the run's.
  appliance:
    needs: signature
    uses: ./.github/workflows/os-image.yml
    with:
      agent-signature: true
      rehearsal-key: true
    permissions:
      contents: read

  # What tools/release-place.sh would say of a tag here, by kind: a dev build
  # may be cut from this commit when it is on a branch a release is cut from
  # (tools/release-branches); a stable release or a release candidate only
  # when it is on main. Said, never failed: a rehearsal runs on the branch a
  # release is being made ready on.
  place:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      stable: ${{ steps.say.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0
      - name: Where a tag on this commit may be cut
        id: say
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          base="$(head -1 VERSION | tr -d '[:space:]')"
          # The jobs that hold the key ask main's copy of the rule and sign
          # nothing without it: said here, before a tag finds it out.
          for f in tools/release-place.sh tools/release-branches; do
            if ! git cat-file -e "origin/main:$f" 2>/dev/null; then
              echo "::warning title=Main does not carry $f::a tag's signing jobs would refuse every release until $f is merged to main"
            elif ! git diff --quiet origin/main HEAD -- "$f"; then
              echo "::notice title=Main's $f is not this commit's::a tag's signing jobs ask main's copy, which differs from this one"
            fi
          done
          bash tools/release-place.sh "v${base}-dev.1" "$GITHUB_SHA" origin/main \
            || echo "::notice title=No dev build from this commit::a dev build's tag here would be refused: its commit is on no branch a release is cut from (tools/release-branches)"
          if bash tools/release-place.sh "v${base}" "$GITHUB_SHA" origin/main; then
            echo "stable=may be cut here" >> "$GITHUB_OUTPUT"
          else
            echo "stable=not from this commit, which is not on main" >> "$GITHUB_OUTPUT"
          fi

  lint:
    uses: ./.github/workflows/lint.yml

  suites:
    uses: ./.github/workflows/dashboard.yml

  manifest:
    needs: [signature, image, bundle, apps, android, appliance, place, lint, suites]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
      # What a tag's last job gathers, gathered the same way: the OS image's
      # files, and every artifact this run named release-*.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        if: needs.appliance.result == 'success'
        with:
          name: aerieos-os
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        with:
          pattern: release-*
          path: rel
          merge-multiple: true
      # The unsigned APK, which a release's controller signs and attaches
      # before the seal: signed below with a key of this run's.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        if: needs.android.result == 'success'
        with:
          name: rehearsal-apk
          path: ${{ runner.temp }}/apk
      # The seal, dry (seal-release.yml's own steps, over what this run
      # built): the pinned library in a step of its own, then the list made
      # and signed with a key of this run's. Where the bundle was built at
      # least; its outcome is a row of the summary below.
      - name: The pinned library the seal uses its key with
        id: lib
        if: needs.bundle.result == 'success'
        run: bash tools/release-lib.sh "$RUNNER_TEMP/release-lib"
      - name: Seal what was built, dry, with a key made for this run
        id: seal
        if: needs.bundle.result == 'success'
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/release-lib
          ANDROID: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          dry="$RUNNER_TEMP/dry"
          mkdir -p "$dry/files" out rel
          # The files where they are, by links: the OS image is not copied.
          # The notes are the release's words, never one of its files.
          find out rel -maxdepth 1 -type f ! -name notes.md -exec ln -s -t "$dry/files" "$PWD"/{} \;
          # A key of this run's own, never the release's: 64 hex characters
          # as the secret is, in this step's environment and nowhere else.
          AERIEOS_RELEASE_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export AERIEOS_RELEASE_KEY
          python3 tools/release-sign.py signer > "$dry/release-signers"
          # A dev build's tag by its shape; nothing is looked up by it.
          tag="v$(head -1 VERSION | tr -d '[:space:]')-dev.0"
          # The Android app signed as a release's is, with a key of this
          # run's, and its certificate the one the seal may take: so the
          # seal's check of the app runs on this runner's own apksigner, as
          # a tag's does (v0.9.0-dev.6049's found no signer in the newer
          # build-tools' way of saying one).
          apk="" signers=()
          for f in "$RUNNER_TEMP"/apk/*.apk; do
            if [ -e "$f" ]; then apk="$f"; fi
          done
          if [ -n "$apk" ]; then
            aps="$(command -v apksigner || find "$ANDROID_HOME"/build-tools -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
            align="$(command -v zipalign || find "$ANDROID_HOME"/build-tools -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -1)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/rehearsal.ks" -storepass rehearsal -keypass rehearsal -alias rehearsal \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=AerieOS rehearsal" >/dev/null 2>&1
            "$align" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            # Signed beside the files, not among them: apksigner writes a v4
            # signature file next to what it signs, which no release carries.
            "$aps" sign --ks "$RUNNER_TEMP/rehearsal.ks" --ks-pass pass:rehearsal --out "$RUNNER_TEMP/signed.apk" \
              "$RUNNER_TEMP/aligned.apk"
            cp "$RUNNER_TEMP/signed.apk" "$dry/files/aerieos-app-rehearsal.apk"
            keytool -list -v -keystore "$RUNNER_TEMP/rehearsal.ks" -storepass rehearsal \
              | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' > "$dry/apk-signers"
            signers=(--apk-signers "$dry/apk-signers")
          elif [ "$ANDROID" = success ]; then
            echo "::error::the Android build passed and handed no APK to the dry seal"
            exit 1
          fi
          python3 tools/release-sign.py seal "$tag" --from "$dry/files" --signers "$dry/release-signers" --out "$dry/sealed" \
            "${signers[@]}" | tee "$dry/seal.log"
          if [ -n "$apk" ]; then
            grep -q "aerieos-app-rehearsal.apk  (apksigner verifies it as signed by a certificate config/apk-signers names)" "$dry/seal.log" \
              || { echo "::error::the dry seal listed the Android app without apksigner holding it to the certificate it was signed with"; exit 1; }
            # ...and one it was not signed with is refused, naming the certificate apksigner said.
            if python3 tools/release-sign.py seal "$tag" --from "$dry/files" --signers "$dry/release-signers" --out "$dry/refused" \
                 > "$dry/refused.log" 2>&1 || ! grep -q "is signed by a certificate config/apk-signers does not name" "$dry/refused.log"; then
              cat "$dry/refused.log"
              echo "::error::the dry seal took an Android app signed by a certificate config/apk-signers does not name"
              exit 1
            fi
          fi
          # ssh-keygen takes the signature against the file written for the
          # key, as an install takes a release's against its own...
          ssh-keygen -Y verify -f "$dry/release-signers" -I aerieos-dev -n aerieos-dev \
            -s "$dry/sealed/SHA256SUMS.sig" < "$dry/sealed/SHA256SUMS"
          # ...and no install takes this one: the committed file names another key.
          if ssh-keygen -Y verify -f config/release-signers -I aerieos-dev -n aerieos-dev \
               -s "$dry/sealed/SHA256SUMS.sig" < "$dry/sealed/SHA256SUMS" >/dev/null 2>&1; then
            echo "::error::a key made in this job verifies against config/release-signers"
            exit 1
          fi
          echo "sealed dry: $(wc -l < "$dry/sealed/SHA256SUMS") files listed and signed, and nothing attached"
      - name: Say what a release from this commit would carry
        # Whatever the seal above made of it: its outcome is said here.
        if: always()
        shell: bash
        env:
          SEAL: ${{ steps.seal.outcome }}
          VER: ${{ needs.bundle.outputs.version }}
          TAG: ${{ needs.bundle.outputs.tag }}
          SIGNATURE: ${{ needs.signature.result }}
          IMAGE: ${{ needs.image.result }}
          BUNDLE: ${{ needs.bundle.result }}
          APPS: ${{ needs.apps.result }}
          ANDROID: ${{ needs.android.result }}
          APPLIANCE: ${{ needs.appliance.result }}
          LINT: ${{ needs.lint.result }}
          SUITES: ${{ needs.suites.result }}
          PLACE: ${{ needs.place.result }}
          STABLE: ${{ needs.place.outputs.stable }}
        run: |
          set -eo pipefail
          {
            echo "## A release from this commit${TAG:+, $TAG}"
            echo
            echo "| Build | Result |"
            echo "| --- | --- |"
            echo "| The agent signed with a key made here, checked, and refused by the committed key | $SIGNATURE |"
            echo "| The container image built with it, started on each release's /config, its root tier run in it | $IMAGE |"
            echo "| Controller bundle, with the signature, and the release's notes | $BUNDLE |"
            echo "| Companion (.pyz, .exe) and VS Code extension | $APPS |"
            echo "| Android APK (signed by the controller after a release) | $ANDROID |"
            echo "| AerieOS (built and booted) | $APPLIANCE |"
            echo
            echo "| What a tag is held to | Result |"
            echo "| --- | --- |"
            echo "| aerie lint and the unit tier | $LINT |"
            echo "| The browser suites | $SUITES |"
            echo "| The seal, dry: the pinned library, the list signed with a key made here and verified | ${SEAL:-not run} |"
            echo "| A dev build from this commit | may be cut here |"
            echo "| A stable release or a candidate from this commit | ${STABLE:-not said ($PLACE)} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # The list read as the tag's last job reads it, over the files
          # this run built. Some are never a rehearsal's: the signed Android
          # app, which a controller attaches to a release that exists; the
          # OS image's attestation and the line naming the pushed image by
          # its digest, which the release's own job writes; and the signed
          # list of the release's files, which is made over all of them once
          # the app is there (seal-release.yml; sealed dry above).
          # A branch's OS image is named for its version as the image says
          # it of itself, X.Y.Z-dev.N+commit, where every other file is named
          # with a hyphen there; on a tag the two are one. Read as one here.
          mkdir -p out rel
          mapfile -t have < <(find out rel -maxdepth 1 -type f ! -name notes.md -printf '%f\n' | tr '+' '-' | sort)
          mapfile -t lacks < <(bash tools/release-missing.sh .release-files "${VER:-VERSION}" "${have[@]}")
          later=() missing=()
          for f in "${lacks[@]}"; do
            case "$f" in
              aerieos-app-*.apk|aerieos-app-*.apk.sha256|aerieos-os-*.attestation.jsonl) later+=("$f") ;;
              aerieos-image-*.digest|SHA256SUMS|SHA256SUMS.sig) later+=("$f") ;;
              *) missing+=("$f") ;;
            esac
          done
          {
            echo "The files a release must carry (.release-files), for ${VER:-this version}:"
            echo
            grep -v '^[[:space:]]*\(#\|$\)' .release-files | sed "s|@VER@|${VER:-VERSION}|g" | while IFS= read -r f; do
              case " ${later[*]} " in *" $f "*) echo "- $f: added once a release is made"; continue ;; esac
              case " ${missing[*]} " in *" $f "*) echo "- $f: **not built here**"; continue ;; esac
              echo "- $f: built"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::a release from here would lack ${missing[*]}"
            exit 1
          fi
          for r in "$SIGNATURE" "$IMAGE" "$BUNDLE" "$APPS" "$ANDROID" "$APPLIANCE"; do
            [ "$r" = success ] || { echo "::error::not every build passed: a release from here would be missing files"; exit 1; }
          done
          for r in "$LINT" "$SUITES" "$PLACE"; do
            [ "$r" = success ] || { echo "::error::not every check passed: a tag on this commit would publish nothing"; exit 1; }
          done
          [ "$SEAL" = success ] || { echo "::error::the dry seal did not pass (${SEAL:-not run}): a release from here could not have its list of files signed"; exit 1; }
          echo "every build and every check passed: a tag on this commit carries the whole release"
