name: publish release

# A release is made a draft (build-image.yml) and published by its owner
# once its notes are read (the operator, 1 Nov: aerie version publish, or the
# Artifacts view's Publish); a dev build's is published by its own build
# once every file is on it (the operator, 11 Nov), which starts this by
# name. Publishing it is what moves the image tags
# people follow onto the version the tag built: :dev for every release, and
# :latest and :MAJOR.MINOR for a stable one. A release published by a
# person's token starts this; one published by a workflow's own token would
# not, so the dispatch does the same by name.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the published release's tag, vX.Y.Z or a pre-release's, vX.Y.Z-dev.N or -rc.N"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  follow:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1, pinned by commit (R206)
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0, pinned by commit (R206)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the tags people follow
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1 ;; esac
          img="$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          ver="${TAG#v}"
          docker buildx imagetools inspect "$img:$ver" >/dev/null \
            || { echo "::error::$img:$ver is not there: the tag's image build has not finished"; exit 1; }
          follow=(dev)
          case "$ver" in
            *-*) ;;
            *) follow+=(latest "$(printf '%s' "$ver" | cut -d. -f1-2)") ;;
          esac
          for t in "${follow[@]}"; do
            docker buildx imagetools create -t "$img:$t" "$img:$ver"
            echo "$img:$t is $ver" | tee -a "$GITHUB_STEP_SUMMARY"
          done
