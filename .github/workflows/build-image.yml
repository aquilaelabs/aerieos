name: build image

# A hosted build bills against the plan's included minutes, so it runs only
# when something the image is actually built FROM changes: the allowlist below
# is exactly the Dockerfile's COPY sources plus the build definition itself.
# This used to be a paths-ignore, which charged a full build for every change
# to a workflow, dashboard doc or lint config that could not have altered the
# image.
#
# And only on the way IN, not on the way there. This used to build the pull
# request too. That was the same build, minutes earlier, publishing nothing,
# and then again on the merge that followed it: two hosted builds for one
# answer, of which only the second produces the image anybody runs. What it
# bought was learning about a broken Dockerfile before the merge instead of
# after, and after is cheap here: the build fails on main, :latest does not
# move, and nothing broken is served, so you fix forward instead of finding
# out early.
# The lint workflow still runs on every PR; it is self-hosted, so it is free.
on:
  push:
    branches: ["main"]
    # A release's tag (v0.5.0) publishes that release's own image, :0.5.0 and
    # :0.5, so an install can pin a release and roll back to the one before
    # (docs/install.md#upgrading). Path filters do not apply to a tag push.
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      # ...and the rest of what the Dockerfile copies in or stamps from:
      # a change to any of these shipped nothing until the weekly rebuild.
      - "nodes/**"
      - "CHANGELOG.md"
      - "VERSION"
      - ".github/workflows/build-image.yml"
  schedule:
    # Weekly rebuild so the base image, Claude Code and the runner stay fresh.
    - cron: "0 6 * * 1"
  # The checkbox is off by default so a manual run is a cheap retry of a build
  # that failed. It used to be implicit: every dispatch rebuilt from scratch,
  # which gives every layer a new digest and makes the host re-pull the whole
  # image, and that is a surprise when the intent was only "run that again".
  # Worth knowing beside it: GitHub's *Re-run all jobs* keeps the original
  # `push` event, so a re-run always used the cache; only this button differed.
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild every layer from scratch (slow; the host then re-pulls the whole image)"
        type: boolean
        default: false
      appliance:
        description: "Build the appliance image too (AerieOS, image/build.sh; an hour on a hosted runner)"
        type: boolean
        default: false

# What a job is given unless it says more: to read the repository. The
# jobs that push the image, attest a file or make the release name what
# they need themselves (R206 step 9: this workflow holds the release key).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A release's tag is held to three things before anything is built to
  # publish (R206, the operator, 14 Nov): it is cut from where its kind may be
  # (place), `aerie lint` and the unit tier pass (lint), and every browser
  # suite passes (suites). A tag ran none of them: the image was pushed and
  # the release made side by side, on whatever commit the tag named. Each is
  # skipped on a push to main, the weekly rebuild and a dispatch, which
  # publish no release, and the jobs below take skipped as passed.
  place:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0
      - name: The tag is cut from where its kind may be
        # A dev build on the branch it was built on; a stable release or a
        # release candidate only on a commit that is on main.
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          bash tools/release-place.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" origin/main

  lint:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/lint.yml

  suites:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/dashboard.yml

  build:
    # After the tag's three checks, or at once where they do not apply.
    needs: [place, lint, suites]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    # A pinned image, never ubuntu-latest: GitHub repoints that label at a new
    # release on its own date (Ubuntu 26 from 19 Oct 2026), and aerie lint fails
    # on it here so the pin moves only in a commit (R116).
    runs-on: ubuntu-24.04
    # Two merges in quick succession queue two builds of the same branch, and
    # only the newest result means anything, so cancel the superseded one
    # rather than pay for an image already out of date when it lands.
    #
    # On THIS job, not the workflow. It used to be on the workflow, and then
    # the `record` job below (a bookkeeping step that waits for the node's
    # runner) kept a canceled run alive in the group, and the next build
    # (a manual dispatch included) sat in "waiting for build image #N" for as
    # long as that runner was busy or away. A recorder must not be able to
    # hold up the build it records.
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    # Read by the `record` job below, which is the only consumer: it runs on
    # the self-hosted runner and writes them somewhere a session inside the
    # container can read without a token.
    outputs:
      version: ${{ steps.ver.outputs.v }}
      digest: ${{ steps.push.outputs.digest }}
      elapsed: ${{ steps.elapsed.outputs.s }}

    steps:
      # Elapsed time is the only signal here for whether the layer cache was
      # actually used (nothing in the API reports a cache hit), and the two
      # cases are minutes apart: a scripts-only build reuses every toolchain
      # layer, a from-scratch one rebuilds all of them. Worth one variable.
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      # Full history, not the default depth-1: the version's ordinal is
      # `git rev-list --count HEAD`, and a shallow clone answers that with 1.
      # It would not fail; every build would just silently call itself
      # .dev.1, which is worse.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (R206)
        with:
          fetch-depth: 0

      # The hosted runner ships ~25GB of toolchains this build never uses
      # (dotnet, the runner's own Android SDK, GHC, CodeQL). This image was
      # large enough that the export phase ran the disk dry at "exporting
      # layers", and silently, because a full disk kills the step before it
      # can say why. Reclaim the space first, and print the number so the next
      # capacity failure is a figure in the log rather than a mystery.
      #
      # The image has since lost ~2.9GB compressed to the toolchain store, which is
      # headroom rather than a reason to stop: this step costs seconds, and
      # what it protects against gives no error message. Note also that the
      # paths below are the RUNNER's preinstalled toolchains, unrelated to
      # what this image installs: /usr/local/lib/android is GitHub's Android
      # SDK, several GB, and is worth deleting no matter what we ship.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1, pinned by commit (R206)
      # For the push, and for reading the cache manifest out of :latest before
      # it: the package is private, so even the read needs the token.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0, pinned by commit (R206)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry refs must be lowercase and the repository name is not.
      - name: Derive cache ref
        id: cache
        run: |
          echo "ref=$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):main" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0, pinned by commit (R206)
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Never by itself: type=semver on a stable tag would add :latest at
          # the tag's push, before anybody has read the release.
          flavor: latest=false
          tags: |
            # What people follow (:latest, :dev, :X.Y) moves only when a
            # release is published (publish-release.yml), never here: a
            # release is a draft until its owner has read it (the operator,
            # 1 Nov). A tag pushes its exact version alone, and main its own
            # :main, which the next build's cache seeds from.
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=semver,pattern={{version}}

      # What the image will say it is when someone asks it from the inside.
      # The commit is the one being built; the time is this build's, not the
      # commit's, because the weekly rebuild ships new packages under an
      # unchanged sha and "which of those two is on my box" is the question.
      - name: Stamp the build
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      # The ordered identity, as `aerie version` says it of this checkout: the
      # one tool every other build asks (the Android app, the companions,
      # the rehearsal), where this workflow worked it out again in its own
      # shell and the two disagreed on a pre-release's tag (R206 step 9). It
      # needs python3 and git and no image. On a tag the answer is the tag's
      # own words, and a tag the tree's VERSION does not agree with is a
      # failure here, before anything is pushed under either name.
      - name: Derive the version
        id: ver
        run: |
          tag=""
          [ "$GITHUB_REF_TYPE" = tag ] && tag="$GITHUB_REF_NAME"
          v="$(BB_RELAYED=1 BB_VERSION_TAG="$tag" bash scripts/aerie version --semver)" \
            || { echo "::error::aerie version did not say what this checkout is"; exit 1; }
          if [ -n "$tag" ] && [ "$v" != "${tag#v}" ]; then
            echo "::error::the tag is $tag and aerie version says $v of its commit: the tag's version and the VERSION file disagree, or the tree changed after the checkout"
            exit 1
          fi
          echo "built $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Sign the agent with the release key
        # A node that pinned AerieOS's release key takes an agent update only
        # with this signature (scripts/agent/aerieos_agent/release.py). The
        # key is this repository's secret and no controller's; with none set
        # the step says so and the build ships unsigned, as a branch's does.
        shell: bash
        env:
          AERIEOS_RELEASE_KEY: ${{ secrets.AERIEOS_RELEASE_KEY }}
        run: |
          python3 -c 'import cryptography' 2>/dev/null || python3 -m pip install --quiet --user cryptography
          python3 tools/sign-agent.py
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0, pinned by commit (R206)
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            IMAGE_REV=${{ github.sha }}
            IMAGE_BUILT=${{ steps.stamp.outputs.at }}
            IMAGE_VERSION=${{ steps.ver.outputs.v }}
          # The workflow's own token for GitHub's release API, which the
          # image's tool downloads are checked against (scripts/lib/gh-fetch):
          # a secret mount, in no layer of the image.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          # Every trigger left pushes: a merge to main (:main), the weekly
          # refresh, a dispatch and a tag (its version alone); what people
          # follow moves only when a release is published.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NO PROVENANCE ATTESTATION, so that this image is published as a
          # plain manifest rather than an OCI image index.
          #
          # build-push-action attaches one by default, and an image with an
          # attestation has to be an index: the image and the attestation are
          # two entries in it. ghcr then serves the tag ONLY to a request that
          # accepts application/vnd.oci.image.index.v1+json, and answers 404 to
          # one that asks for the docker manifest types. A NAS's Docker page
          # asks for the docker types, so every image that moved to an index
          # went to "not available" in its version column. That was measured on
          # ghcr.io/advplyr/audiobookshelf, which 404s for every Accept header
          # but that one, and the box stopped being able to say whether it was
          # running the current AerieOS.
          #
          # What it costs: no SLSA provenance on the published image. Worth it
          # here: one platform, one private image, one consumer, and that
          # consumer's whole job is to tell the operator whether the box is
          # current. Delete this line to get the attestation back, and the
          # version column goes blank again until such a page can read an index.
          provenance: false
          # Inline cache, not the GHA cache. The GHA quota is 10GB per repo
          # and this image's layers alone exceeded it, so every build's cache
          # export evicted the previous build's entry: all of the cost, none
          # of the hits. A smaller image would now fit, but there is nothing
          # to go back for: this is a single-stage build, so every layer
          # worth caching ends up in the published image, which is precisely
          # what inline caches, and `mode=max`'s advantage, keeping
          # intermediate layers that never ship, does not exist here. Inline
          # embeds the cache metadata in the pushed image itself, with no
          # separate store and nothing to evict, and seeding from
          # :main lets an unchanged prefix of the Dockerfile reuse the
          # previous build's layers digest-for-digest. That reuse is also
          # what keeps the host's pull small: scripts/ and config/ are COPY'd
          # last, so a scripts-only change re-downloads megabytes of tail
          # instead of every gigabyte of toolchain above it.
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=inline
          # The weekly build exists to pick up fresh packages, and a fully
          # cached rebuild of an unchanged Dockerfile would reuse every layer
          # and refresh nothing, so the schedule always pays for the full
          # rebuild; that is the once a week the big download buys something.
          # A dispatch pays it only when asked: "freshen it now" and "that run
          # died, run it again" arrive through the same button and want
          # opposite answers. `inputs.no_cache` is null on a push, and
          # `null == true` is false, so every other trigger stays cached.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

      - name: Stop the clock
        id: elapsed
        # always(), because the run worth reading afterwards is the one that
        # failed, and how long it got before dying is half of what it says.
        if: always()
        run: echo "s=$(( $(date +%s) - T0 ))" >> "$GITHUB_OUTPUT"

  # The image just pushed, started on each release snapshot of /config through
  # its own entrypoint and startup hooks (tools/upgrade-image.sh): a person's
  # update is the new image on the /config the old one left, and the upgrade
  # suite starts server.py alone, with stand-ins for everything outside it.
  # After the push, since that is where the image is: a red run here says the
  # image under :main does not come up on a release's /config, before a
  # release is cut from it.
  upgrade:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (R206)
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0, pinned by commit (R206)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the image on each release's /config
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          image="$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')@$DIGEST"
          docker pull --quiet "$image"
          tools/upgrade-image.sh "$image"

      # The image's own copy of the root tier, as root in a throwaway
      # container of it (R240 step 5): what ships is what is proved, where
      # the lint workflow's job proves the checkout's.
      - name: The root tier in the image itself
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          image="$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')@$DIGEST"
          tools/root-tier.sh "$image"

  # The build runs on a hosted runner, out of reach of the container that
  # will eventually run its image, and invisible from inside it. So this job
  # comes back to the box and writes the outcome where `aerie ci-log` reads it.
  #
  # It is the answer to a question that had none: a session was asked why the
  # host re-pulled every layer, and could not see that three builds had failed
  # before this one, or which of them was a dispatch. Seconds of work on the
  # self-hosted runner, and the alternative is a PAT.
  record:
    # Every job of the run, not the image's alone: a run whose OS image failed
    # was recorded a success (B455). A skipped job (no tag, no box ticked)
    # counts as nothing either way.
    needs: [place, lint, suites, build, upgrade, bundle, apps, android, appliance, release]
    # Failed, canceled and skipped are exactly the outcomes worth recording.
    if: always()
    # The image is pushed by the time this runs, so nothing waits on it: with
    # the box down the job simply queues until the box is back, and records a
    # build that finished half an hour earlier.
    #
    # It can still lose a race, and did on its first live run: the runner takes
    # one job at a time, this one queued behind the same branch's lint, and the
    # operator updated the container, killing both, before it got a turn. The
    # loss is survivable by construction, because the outcome most likely to be
    # lost that way is a SUCCESS whose image is about to be recorded in
    # /config/image-log.tsv anyway. A failed build publishes nothing, so nobody
    # updates, so the runner stays up and the record gets written, which is
    # the case this job exists for.
    runs-on: [self-hosted, bb-sandbox]
    # A bookkeeping job must not be able to paint a successful build red. It
    # still shows as failed on its own row, which is where a broken recorder
    # belongs; the run's status stays the build's.
    continue-on-error: true
    steps:
      - name: Archive the outcome where the container can read it
        shell: bash
        # Through env rather than interpolated into the script: the same rule
        # the dashboard follows for anything the web can reach, and it keeps
        # a workflow input out of a command line.
        env:
          JOB_RESULTS: "place=${{ needs.place.result }} lint=${{ needs.lint.result }} suites=${{ needs.suites.result }} build=${{ needs.build.result }} upgrade=${{ needs.upgrade.result }} bundle=${{ needs.bundle.result }} apps=${{ needs.apps.result }} android=${{ needs.android.result }} appliance=${{ needs.appliance.result }} release=${{ needs.release.result }}"
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_ELAPSED: ${{ needs.build.outputs.elapsed }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          # The same path the other workflows and `aerie ci-log` resolve:
          # BB_CI_LOG_DIR from the runner's .env on a node (its data store,
          # readable by a session there), /config on a controller, the home
          # as the fallback.
          dir="${BB_CI_LOG_DIR:-}"
          if [ -z "$dir" ]; then
            if [ -w /config ]; then dir=/config/ci-logs; else dir="$HOME/ci-logs"; fi
          fi
          dir="$dir/${GITHUB_REPOSITORY##*/}"
          # A box with no /config volume should lose the record, not fail the
          # build over it, but it should say so rather than look successful.
          mkdir -p "$dir" || { echo "no writable /config, so nothing archived"; exit 0; }
          log="$dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"

          # The run's result is its worst job's, each job's said under it.
          result=success
          for jr in $JOB_RESULTS; do
            case "${jr#*=}" in
              failure) result=failure ;;
              # GitHub's own word for a job stopped short, spelled as it spells it.
              cancel*led) [ "$result" = failure ] || result="cancel""led" ;;
            esac
          done

          case "$BUILD_ELAPSED" in
            ''|*[!0-9]*) took="unknown" ;;
            *) took="$((BUILD_ELAPSED / 60))m $((BUILD_ELAPSED % 60))s" ;;
          esac
          case "$GITHUB_EVENT_NAME" in
            schedule) cache="off (the weekly rebuild always is)" ;;
            *) if [ "$NO_CACHE" = true ]; then
                 cache="off (the run asked for a full rebuild, so the host re-pulls everything)"
               else
                 cache="seeded from :latest"
               fi ;;
          esac

          # The same header the lint workflow writes, because `aerie ci-log` reads
          # both out of this directory and tells them apart by the first line.
          # ...under what a tag's lint, unit tier and suites wrote there in
          # this same run, never over it.
          if [ -s "$log" ]; then
            printf '\n== the run ==\n' >> "$log"
          else
            {
              echo "# ${GITHUB_WORKFLOW} on ${GITHUB_REPOSITORY}"
              echo "run:    ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
              echo "event:  ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
              echo "commit: ${GITHUB_SHA}"
              echo "opened: $(date -Is)"
              echo
            } > "$log"
          fi
          {
            echo "version: ${BUILD_VERSION:--}"
            echo "digest:  ${BUILD_DIGEST:-not pushed}"
            echo "took:    ${took}"
            echo "cache:   ${cache}"
            echo
            echo "This is the build's outcome, not its console output: the build"
            echo "itself ran on a hosted runner, which keeps nothing this box can"
            echo "reach. The run page on GitHub has the log."
            echo
            for jr in $JOB_RESULTS; do printf 'job %s: %s\n' "${jr%%=*}" "${jr#*=}"; done
            printf 'result: %s\n' "$result"
            printf 'closed: %s\n' "$(date -Is)"
          } >> "$log"
          cat "$log"

          # Twenty kept, the same as the lint workflow's, and counted over the
          # whole directory because both workflows write into it.
          find "$dir" -maxdepth 1 -name '*.log' -printf '%T@ %p\n' \
            | sort -rn | tail -n +61 | cut -d' ' -f2- | xargs -r rm -f

  # The controller bundle a release publishes (R90 step 5): the tag's tree
  # as aerieos-controller-X.Y.Z.tar.gz with its sha256 beside it and a
  # build attestation, which install-controller.sh --update on a bare-metal
  # install fetches and verifies in place of the tag's source archive. On a
  # tag push alone. It makes no release: the bundle and the release's notes
  # are handed to the last job, which makes the release once (R206 step 1).
  bundle:
    # Signed with the release key, so only once the tag's checks have passed.
    needs: [place, lint, suites]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (R206)
        with:
          fetch-depth: 0
      - name: Sign the agent with the release key
        # A node that pinned AerieOS's release key takes an agent update only
        # with this signature (scripts/agent/aerieos_agent/release.py). The
        # key is this repository's secret and no controller's; with none set
        # the step says so and the build ships unsigned, as a branch's does.
        shell: bash
        env:
          AERIEOS_RELEASE_KEY: ${{ secrets.AERIEOS_RELEASE_KEY }}
        run: |
          python3 -c 'import cryptography' 2>/dev/null || python3 -m pip install --quiet --user cryptography
          python3 tools/sign-agent.py
      - name: Pack the tag's tree
        id: pack
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          name="aerieos-controller-${ver}.tar.gz"
          # The tree as the release carries it, with the commit's hash where
          # the installer reads it (tree_stamp's .release-rev).
          git archive --format=tar --prefix="builderbot-${ver}/" "$tag" > tree.tar
          mkdir -p stamp/"builderbot-${ver}" && git rev-parse "$tag^{commit}" > stamp/"builderbot-${ver}"/.release-rev
          tar -rf tree.tar -C stamp "builderbot-${ver}/.release-rev"
          # ...and the agent's signature, which is made by this build and is
          # in no commit: beside the agent's sources, where the controller reads it.
          if [ -s scripts/agent/agent.sig ]; then
            mkdir -p stamp/"builderbot-${ver}"/scripts/agent && cp scripts/agent/agent.sig stamp/"builderbot-${ver}"/scripts/agent/
            tar -rf tree.tar -C stamp "builderbot-${ver}/scripts/agent/agent.sig"
          fi
          gzip -n -9 < tree.tar > "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Attest the bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be   # v2.4.0, pinned by commit (R206)
        with:
          subject-path: ${{ steps.pack.outputs.name }}
      - name: Write the release's notes
        shell: bash
        env:
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          # The notes are the tree's when it has them for this version
          # (docs/release-notes/X.Y.Z.md, or X.Y.Z-dev.md for a dev build),
          # @TAG@, @VER@ and @REPO@ filled in, so the release is made with
          # them rather than edited after. Otherwise they are the changelog's
          # own: the version's section for a release, and for a dev build only
          # what Unreleased gained since the tag before (tools/release-notes.py).
          ver="${TAG#v}"; base="${ver%%-*}"
          notes="docs/release-notes/$base.md"; case "$TAG" in v*-*) notes="docs/release-notes/$base-dev.md";; esac
          head="## $base:"
          if [ -f "$notes" ]; then
            sed -e "s|@TAG@|$TAG|g" -e "s|@VER@|$ver|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" "$notes" > notes.md
          elif [ "$ver" != "$base" ]; then
            python3 tools/release-notes.py "$TAG" > notes.md
          else
            awk -v h="$head" 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
            grep -q '[^[:space:]]' notes.md || echo "AerieOS $ver: see CHANGELOG.md." > notes.md
          fi
          # Which download is for what, at the top of every release (the
          # operator, 6 Nov: the files alone did not say).
          if [ -f docs/release-notes/downloads.md ]; then
            { sed -e "s|@TAG@|$TAG|g" -e "s|@VER@|$ver|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" docs/release-notes/downloads.md; cat notes.md; } > notes.all
            mv notes.all notes.md
          fi
      # A day, the shortest there is: this is how the bundle and the notes
      # reach the last job of the same run, and nothing reads them afterwards.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2, pinned by commit (R206)
        with:
          name: release-bundle
          path: |
            ${{ steps.pack.outputs.name }}
            ${{ steps.pack.outputs.name }}.sha256
            notes.md
          if-no-files-found: error
          retention-days: 1

  # The apps a person installs (companion-app.yml) and the Android app
  # (android-app.yml), as jobs of this run (R206 step 1): the bundle's job
  # started each by name once it had made the release, so a tag's files came
  # from three runs that each looked for "the release", and a run that
  # failed was nobody's to notice. The companion's files are handed to the
  # last job; the Android app's unsigned APK is handed to the controller,
  # which signs it and attaches it once the release is there (releasesign.py).
  apps:
    needs: [place, lint, suites]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/companion-app.yml
    with:
      tag: ${{ github.ref_name }}
      hand-on: true
    # What the called workflow asks for, for its own run by hand, where it
    # attaches to a release that exists; handing on writes nothing.
    permissions:
      contents: write
    secrets: inherit

  android:
    needs: [place, lint, suites]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/android-app.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  # The OS image (R160): built and booted by os-image.yml, which a branch
  # push touching the image also runs on its own, so a fix is proved without
  # a tag or a release (the operator, 30 Oct); a tag, a manual run with the
  # box ticked and the weekly rebuild call it here, and the last job puts
  # what it built on the release.
  appliance:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.appliance) || github.event_name == 'schedule'
    uses: ./.github/workflows/os-image.yml
    # The release key, for the agent the image carries (os-image.yml signs it).
    secrets:
      AERIEOS_RELEASE_KEY: ${{ secrets.AERIEOS_RELEASE_KEY }}

  # The release, made once, here, by the run's last job (R206 step 1): every
  # file the run built and the notes, on one release that did not exist until
  # all of it had passed. Four jobs in three workflows each made or looked
  # for the tag's release before (two drafts for one tag, 2 Nov), and a
  # draft filled up file by file over an hour. The image is pushed and
  # started on every release's /config (upgrade), the bundle is packed, the
  # apps are built, the OS image is built and booted, and the tag's three
  # checks have passed, or this job does not run and there is no release.
  # The signed Android app is the controller's to attach, once this is made.
  release:
    needs: [place, lint, suites, build, upgrade, bundle, apps, android, appliance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      # To start publish-release.yml for a dev build this job publishes.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          sparse-checkout: |
            tools
            .release-files
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        with:
          name: aerieos-os
          path: out
      # The bundle with the notes, and the companion's files: every artifact
      # this run named release-*, into one folder.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0, pinned by commit (R206)
        with:
          pattern: release-*
          path: rel
          merge-multiple: true
      # Two files go on the release, the ISO and the USB stick's image, each
      # with its sha256 (the operator, 30 Oct): an update takes the slot, its
      # kernel and its initrd out of the ISO, and the raw disk, qcow2 and OVA
      # stay the boot test's and the run's artifact.
      - name: Attest the ISO and the stick
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be   # v2.4.0, pinned by commit (R206)
        with:
          subject-path: |
            out/aerieos-os-*.iso
            out/aerieos-os-*.stick.raw.xz
      - name: Make the release, with every file and the notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The attestation's bundle beside them, one line: an update from a
          # folder verifies the ISO with it and no network, against the
          # trusted root the image carries.
          iso="$(find out -maxdepth 1 -name 'aerieos-os-*.iso' | head -1)"
          jq -c . "$BUNDLE" > "${iso%.iso}.attestation.jsonl"
          [ -s rel/notes.md ] || { echo "::error::the bundle's job handed on no notes"; exit 1; }
          # A dev build's tag (vX.Y.Z-dev.N, R179) is a pre-release and never
          # the latest: the dev channel alone takes it. Every release starts
          # a draft, seen by the repository's own people alone; a release
          # that is not a dev build stays one until its owner has read its
          # notes and publishes it (the operator, 1 Nov). Made once, or found
          # where a job of this run is run again (tools/release-attach.sh).
          files=()
          for f in rel/*; do
            case "$f" in rel/notes.md) ;; *) files+=("$f") ;; esac
          done
          bash tools/release-attach.sh "$tag" --notes rel/notes.md "${files[@]}" \
            out/aerieos-os-*.iso out/aerieos-os-*.iso.sha256 \
            out/aerieos-os-*.stick.raw.xz out/aerieos-os-*.stick.raw.xz.sha256 \
            "${iso%.iso}.attestation.jsonl"
      # A dev build's release goes out by itself, here, as the last thing its
      # build does, and only once every file .release-files names is on it
      # (the operator, 11 Nov): two were published by hand from the git
      # host's page minutes after their tags, and one never got its image.
      # The one file not on it yet is the signed Android app, which the
      # controller attaches within minutes of the release being made; this
      # waits for it, and a release it never reaches stays a draft, the
      # missing file named. A release that is not a dev build stays a draft
      # for its owner to read.
      - name: A dev build's release goes out once it is whole
        if: contains(github.ref_name, '-dev.')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          bash tools/release-attach.sh "$tag" --publish-when-whole .release-files | tee whole.log
          # A release this job's own token publishes starts no workflow
          # (GitHub's rule), so what follows a publication, the image tags
          # people follow moved onto this build, is started by name.
          if grep -q " published: whole" whole.log; then
            gh workflow run publish-release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f tag="$tag"
          fi
