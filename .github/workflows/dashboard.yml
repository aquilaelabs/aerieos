name: dashboard tests

# Its own workflow rather than a step inside lint, because the two go red for
# different reasons and one was hiding the other. The browser suite is
# timing-sensitive and this runner shares its box with the live dashboard, any
# session and any build, so it fails here far more often than it does when run
# by hand, and while it was a step in the lint job it took shellcheck,
# hadolint and actionlint's verdict down with it, and the compose and XML
# checks that came after it never ran at all. Twelve consecutive lint runs were
# red on exactly that, and the deterministic half of them had passed every
# time.
#
# So: a red run here says "the browser tests are flaky again", and a red lint
# says the code is actually wrong. Two answers, two checks.
#
# This does NOT make the suite reliable on a loaded box; see bug #19. It makes
# its unreliability stop costing the checks that are reliable.
on:
  pull_request:
    # Replaces the git-diff test the old step did by hand. Same intent (only
    # worth running when it could have changed), expressed where GitHub can
    # act on it, so the job is never queued rather than started and skipped.
    #
    # What the suites test, all of it (R206; the audit of 13 Nov): they start
    # the node's agent, run aerie and the root helpers and read the image's
    # own files, and a change to any of those ran no suite.
    paths:
      - "scripts/dashboard/**"
      - "scripts/agent/**"
      - "scripts/lib/**"
      - "scripts/aerie"
      - "scripts/bb"
      - "nodes/**"
      - "config/**"
      - "apps/vscode/**"
      - "Dockerfile"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:
  # ...and for a release's tag, called by build-image.yml before anything is
  # built to publish: nothing is published that the suites have not passed.
  workflow_call:

# A superseded push's result is worthless, so cancel it rather than make the
# (single) self-hosted runner work through the backlog serially.
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    # A node: Playwright and Chromium are its toolchain store's, on the PATH
    # the runner's .env carries (the agent writes the same environment every
    # bb job gets). The harness FAILS by name when they are missing rather
    # than passing by omission: it skipped with exit 0 until 8 Sep, and every
    # run here was green without a test (bug B74).
    # Not for a fork's pull request: this runner is a machine on its owner's
    # network and its jobs account reaches Docker there. This line stops a
    # fork's request that leaves the workflow as it is; one that changes the
    # workflow runs its own copy, so the protection that holds is the
    # repository's setting (Settings, Actions, General: require approval for
    # all external contributors) and reading a request's workflow changes
    # before approving its run. A request from a branch of this repository,
    # and a manual run, go on as before.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bb-sandbox]
    # A run that hangs is ended, not left holding the one runner: the whole
    # set and its second try are under an hour on this machine.
    timeout-minutes: 120
    # `bash` rather than the default `bash -e`, because that one difference is
    # pipefail, and the run below is piped into tee. Without it the tee's exit
    # status is the step's, and a failing suite would report success.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)

      - name: Open a log this container can read afterwards
        # The same archive lint.yml keeps, and for the same reason: the runner
        # streams a step's output to GitHub and keeps none of it on disk, so a
        # session in this container, which has no PAT, could see that CI was
        # red and nothing about why. `aerie ci-log` reads what this writes.
        #
        # The run id is unique per workflow, so this cannot collide with the
        # lint run beside it even when both fire on the same push.
        run: |
          # Where the log is kept. On a node, BB_CI_LOG_DIR: the runner's
          # .env names the node's data store, which a session there can read
          # (the runner's own home is 0700 to it). Then /config on the
          # controller, because it survives an image update; the home is the
          # fallback. `aerie ci-log` resolves the same three in the same order,
          # and fetches across when the run was on a node.
          dir="${BB_CI_LOG_DIR:-}"
          if [ -z "$dir" ]; then
            if [ -w /config ]; then dir=/config/ci-logs; else dir="$HOME/ci-logs"; fi
          fi
          dir="$dir/${GITHUB_REPOSITORY##*/}"
          mkdir -p "$dir"
          log="$dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "CI_LOG=$log" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$dir" >> "$GITHUB_ENV"
          # One log a run: its first job writes the head `aerie ci-log` names
          # the run by, and each job after it (a tag's run has the lint, the
          # unit tier and the browser suites) adds its own part under it.
          if [ -s "$log" ]; then
            printf '\n== %s ==\n' "${GITHUB_JOB}" >> "$log"
          else
            {
              echo "# ${GITHUB_WORKFLOW} on ${GITHUB_REPOSITORY}"
              echo "run:    ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
              echo "event:  ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
              echo "commit: ${GITHUB_SHA}"
              echo "opened: $(date -Is)"
              echo
            } > "$log"
          fi

      - name: Dashboard browser tests
        # An isolated instance on a spare port with a private tmux server and a
        # scratch state dir; nothing it does can reach the live dashboard this
        # runner's container is also serving.
        #
        # Retried once, and only once, because of what this suite's failures
        # actually are. It drives a real browser against a page that repaints on
        # a poll, on a runner sharing its box with the live dashboard, any
        # session and any image build, so a file times out under load and
        # passes alone, every time, which is bug #13. A run that fails twice in
        # a row is worth reading; a run that fails once is worth running again,
        # and mailing somebody about the first one teaches them to ignore the
        # mail. The second attempt is logged separately, so a genuine
        # regression still shows both.
        env:
          # This runner shares its box with the live dashboard, any session and
          # any image build, so every wait in the suite is competing for CPU
          # that a quiet run has to itself. Doubling them costs seconds on a
          # green run and removes the commonest way this goes red for reasons
          # that are not the code (bug #13).
          BB_TEST_SLOW: "2"
        run: |
          set -o pipefail
          if bash scripts/dashboard/test/run.sh 2>&1 | tee -a "$CI_LOG"; then
            exit 0
          fi
          echo | tee -a "$CI_LOG"
          echo "== first attempt failed, running once more ==" | tee -a "$CI_LOG"
          echo "   (this suite is timing-sensitive on a shared box; see bug #13)" \
            | tee -a "$CI_LOG"
          bash scripts/dashboard/test/run.sh 2>&1 | tee -a "$CI_LOG"

      - name: Close the log
        if: always()
        # Written whatever happened, because "it failed and said nothing" is
        # the case this exists for.
        run: |
          printf '\nresult: %s\nclosed: %s\n' "${{ job.status }}" "$(date -Is)" \
            >> "$CI_LOG"
          find "$CI_LOG_DIR" -maxdepth 1 -name '*.log' -printf '%T@ %p\n' \
            | sort -rn | tail -n +61 | cut -d' ' -f2- | xargs -r rm -f
