# The apps a person installs, for each release (R272 step 2): the Windows
# companion (R270) as an .exe, built with PyInstaller on a hosted Windows
# runner from apps/windows/bbcompanion and the four node-agent modules its sync
# is, and as a .pyz for any machine with Python; and the VS Code extension
# as a .vsix. Each attached to the release with its sha256 beside it, as
# the Android app's APK is (android-app.yml), named for the release's
# version, for every controller on that version to fetch, check and offer
# on its card in the Library (apps.py).
#
# Only as a job of a tag's own run (build-image.yml calls it, and its files
# are handed to that run's last job, which makes the release), in a
# rehearsal, or by hand for a release that exists, where it attaches them
# itself: a hosted Windows runner bills twice a Linux one's minutes, and a
# build on every push kept as an artifact is what filled the account's
# Actions storage once already (B669). Signed when the repository holds a
# code-signing certificate (BB_WIN_CERT_PFX_B64 and BB_WIN_CERT_PASSWORD);
# built unsigned and said so in the log where it does not.
name: companion app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release to attach the .exe to"
        required: true
  # Called by a tag's run (build-image.yml, R206 step 1): named for the tag
  # and handed on as that run's artifacts, for its last job to put on the
  # release it makes. And a release rehearsed (release-rehearsal.yml, R190
  # step 2): built with no tag, named for the branch's version, handed on
  # the same way and attached to nothing.
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
      hand-on:
        type: boolean
        default: false

permissions:
  contents: write

# One group per release, and one per branch for a push or a rehearsal: a
# rehearsal must never cancel a release's own build, and a run by hand for
# a tag is not the tag's own run (the workflow's name is the caller's).
concurrency:
  group: companion-app-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  # The two that need no Windows: plain Python packaging on a hosted Linux.
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    # The version every file here is named for: the tag's, or with no tag
    # (a rehearsal) aerie version's of this checkout. Said once, here, for
    # the Windows job too: aerie version does not load on Windows, and a
    # rehearsal's .exe failed asking it there (14 Nov).
    outputs:
      version: ${{ steps.name.outputs.v }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0   # a rehearsal's name is aerie version's, which counts commits

      - name: The version the files are named for
        id: name
        run: |
          set -eo pipefail
          v="${TAG#v}"; [ -n "$v" ] || v="$(BB_RELAYED=1 bash scripts/aerie version --file)"
          [ -n "$v" ] || { echo "::error::no version to name the files for"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Build the .pyz and the .vsix
        env:
          VER: ${{ steps.name.outputs.v }}
        run: |
          set -eo pipefail
          v="$VER"
          python3 tools/companion-build.py --version "$v" --out "dist/aerieos-companion-$v.pyz"
          python3 tools/vscode-vsix.py --version "$v" --out "dist/aerieos-vscode-$v.vsix"

      - name: Write each one's sha256 beside it
        run: |
          set -eo pipefail
          cd dist
          for f in aerieos-companion-*.pyz aerieos-vscode-*.vsix; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Attach them to the release that exists
        if: env.TAG != '' && !inputs.hand-on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          bash tools/release-attach.sh "$TAG" dist/aerieos-companion-*.pyz dist/aerieos-companion-*.pyz.sha256 \
            dist/aerieos-vscode-*.vsix dist/aerieos-vscode-*.vsix.sha256

      # A day, the shortest there is: read by the last job of the same run.
      - name: Hand them to the run's last job
        if: inputs.hand-on
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2, pinned by commit (R206)
        with:
          name: release-apps-portable
          path: |
            dist/aerieos-companion-*.pyz
            dist/aerieos-companion-*.pyz.sha256
            dist/aerieos-vscode-*.vsix
            dist/aerieos-vscode-*.vsix.sha256
          if-no-files-found: error
          retention-days: 1

  build:
    needs: portable
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VER: ${{ needs.portable.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)

      - name: Build the .exe
        run: |
          set -eo pipefail
          python -m pip install --disable-pip-version-check --quiet pyinstaller
          v="$VER"
          printf '%s\n' "$v" > apps/windows/bbcompanion/VERSION
          printf 'from bbcompanion.__main__ import entry\nentry()\n' > "$RUNNER_TEMP/companion.py"
          python -m PyInstaller --noconfirm --onefile --windowed --name "aerieos-companion-$v" \
            --paths apps/windows --paths scripts/agent \
            --hidden-import aerieos_agent.wssync --hidden-import aerieos_agent.controller \
            --add-data "apps/windows/bbcompanion/VERSION;bbcompanion" \
            --distpath dist "$RUNNER_TEMP/companion.py"
          # An entry point PyInstaller could not find still builds, into an
          # .exe that stops at start (B572): its warnings file says so.
          if grep -E "missing module named '?(bbcompanion|aerieos_agent)" "build/aerieos-companion-$v/warn-aerieos-companion-$v.txt"; then
            echo "the companion's own package was left out of the .exe"; exit 1
          fi
          echo "EXE=dist/aerieos-companion-$v.exe" >> "$GITHUB_ENV"

      # AerieOS USB Maker (R198): the stick maker in a window, one .exe
      # that asks for Administrator at start (writing a disk needs it), the
      # stick maker carried inside it beside the window's script.
      - name: Build the USB Maker
        run: |
          set -eo pipefail
          v="$VER"
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name "aerieos-usb-maker-$v" \
            --add-data "tools/aerieos-stick.py;." --distpath dist tools/aerieos-usb-maker.py
          echo "USBEXE=dist/aerieos-usb-maker-$v.exe" >> "$GITHUB_ENV"

      - name: Sign it where the repository holds a certificate
        env:
          BB_WIN_CERT_PFX_B64: ${{ secrets.BB_WIN_CERT_PFX_B64 }}
          BB_WIN_CERT_PASSWORD: ${{ secrets.BB_WIN_CERT_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "$BB_WIN_CERT_PFX_B64" ]; then
            echo "no code-signing certificate in this repository's secrets: the .exe is unsigned, and Windows says so on first run"
            exit 0
          fi
          printf '%s' "$BB_WIN_CERT_PFX_B64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          signtool="$(find "/c/Program Files (x86)/Windows Kits/10/bin" -path '*/x64/signtool.exe' | sort | tail -1)"
          "$signtool" sign //f "$RUNNER_TEMP/cert.pfx" //p "$BB_WIN_CERT_PASSWORD" //fd sha256 \
            //tr http://timestamp.digicert.com //td sha256 "$EXE" "$USBEXE"
          rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Write each one's sha256 beside it
        run: |
          set -eo pipefail
          for f in "$EXE" "$USBEXE"; do
            sha256sum "$f" | sed 's|dist/||' > "$f.sha256"
          done

      - name: Attach them to the release that exists
        if: env.TAG != '' && !inputs.hand-on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          bash tools/release-attach.sh "$TAG" "$EXE" "$EXE.sha256" "$USBEXE" "$USBEXE.sha256"

      - name: Hand them to the run's last job
        if: inputs.hand-on
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2, pinned by commit (R206)
        with:
          name: release-apps-windows
          path: |
            dist/aerieos-companion-*.exe
            dist/aerieos-companion-*.exe.sha256
            dist/aerieos-usb-maker-*.exe
            dist/aerieos-usb-maker-*.exe.sha256
          if-no-files-found: error
          retention-days: 1
