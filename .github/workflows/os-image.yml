# AerieOS (R160): the appliance image built by mkosi and image/build.sh,
# then booted under QEMU until its dashboard answers. Called by
# build-image.yml for a release's tag, a manual run and the weekly rebuild,
# which publishes what it built; and run on its own when a branch push
# touches the image, which publishes nothing, so a fix to the image is proved
# on a push rather than a tag (the operator, 30 Oct).
name: os image

on:
  workflow_call:
    secrets:
      AERIEOS_RELEASE_KEY:
        required: false
  push:
    branches-ignore: ["main"]
    paths:
      - "image/**"
      - "nodes/install-controller.sh"
      - "config/controller-packages.tsv"
      - "scripts/lib/controller-packages.sh"
      - ".github/workflows/os-image.yml"

permissions:
  contents: read

jobs:
  # The appliance image (R160 step 1): AerieOS, built by image/build.sh
  # on a hosted runner, since mkosi installs packages and the disk is laid
  # out on a loop device, neither of which the self-hosted node's container
  # has. On a tag, on a dispatch with its box ticked, and on the weekly
  # schedule (step 6: rebuilt from the day's snapshot, its package diff
  # against the last release kept as an artifact and said in the run's
  # summary; a patch release from it is a press, never this job's). The
  # files go on the release only once appliance-boot has booted the image
  # and seen the dashboard answer (step 5), beside the controller bundle,
  # with a build attestation on each an install reads.
  appliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tools mkosi and the disk need
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            squashfs-tools dosfstools e2fsprogs fdisk grub-efi-amd64-bin grub-pc-bin grub-common xorriso mtools xz-utils qemu-utils python3-pip apt-utils
          # Debian 13's archive keys, newer than the runner's own keyring
          # package, from the same snapshot the image is pinned to.
          snap="$(tr -d '[:space:]' < image/SNAPSHOT)"
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o keyring.deb "https://snapshot.debian.org/archive/debian/${snap}/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb"
          echo "9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  keyring.deb" | sha256sum -c -
          sudo dpkg -i keyring.deb
          # The version build.sh pins (MKOSI_PIN), so a config key means the same here as there,
          # from its tag on GitHub: mkosi is not published on PyPI.
          pin="$(grep -oE 'MKOSI_PIN:-[0-9.]+' image/build.sh | head -1 | cut -d- -f2)"
          sudo pip install --break-system-packages "mkosi @ https://github.com/systemd/mkosi/archive/refs/tags/v${pin}.tar.gz"
          mkosi --version
      - name: The weekly rebuild takes yesterday's snapshot
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          # Yesterday, so the day's snapshot is whole; image/SNAPSHOT in the
          # tree is unchanged (a release moves it by a commit).
          date -u -d 'yesterday 00:00' +%Y%m%dT%H%M%SZ > image/SNAPSHOT
          echo "snapshot: $(cat image/SNAPSHOT)"
      - name: Sign the agent with the release key
        # A node that pinned AerieOS's release key takes an agent update only
        # with this signature (scripts/agent/aerieos_agent/release.py). The
        # key is this repository's secret and no controller's; with none set
        # the step says so and the build ships unsigned, as a branch's does.
        shell: bash
        env:
          AERIEOS_RELEASE_KEY: ${{ secrets.AERIEOS_RELEASE_KEY }}
        run: |
          python3 -c 'import cryptography' 2>/dev/null || python3 -m pip install --quiet --user cryptography
          python3 tools/sign-agent.py
      - name: Build the image
        shell: bash
        # For gh's trusted root, which build.sh bakes into the image.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # The snapshot the image is pinned to has outages apt's own retries
          # do not outlast. Another try picks up from the packages already in
          # mkosi's package cache, which --force keeps, so it costs only what
          # is still missing.
          for try in 1 2 3; do
            sudo -E image/build.sh --out out 2>&1 | tee build.log && exit 0
            [ "$try" -lt 3 ] || break
            grep -qE '^E: Failed to fetch https://snapshot\.debian\.org/.* 50[234] ' build.log || break
            echo "::warning title=Build the image::snapshot.debian.org is failing: try $try of 3 ended, trying again in ten minutes"
            sleep 600
          done
          # A failure's last lines as the job's error annotation (its end, under
          # the annotation's length cap, where the error is), which GitHub
          # shows without signing in, where the log itself needs a token.
          tail -n 40 build.log | tail -c 3500 | python3 -c 'import sys; t = sys.stdin.read(); print("::error title=Build the image::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          exit 1
      - name: What moved since the last release
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' || true)"
          now="$(find out -maxdepth 1 -name 'aerieos-os-*.packages' | head -1)"
          if [ -z "$tag" ] || ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'aerieos-os-*.packages' --dir last 2>/dev/null; then
            echo "no release carries a package list yet: nothing to compare against" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          last="$(find last -maxdepth 1 -name 'aerieos-os-*.packages' | head -1)"
          { echo "## System packages moved since ${tag}"; echo; echo '```'; diff <(sort "$last") <(sort "$now") | grep '^[<>]' || echo "none"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          diff <(sort "$last") <(sort "$now") > out/packages-moved.diff || true
      - uses: actions/upload-artifact@v4
        with:
          name: aerieos-os
          path: |
            out/aerieos-os-*
            out/packages-moved.diff
          if-no-files-found: error

  # The image booted before anything of it is published (R160 step 5): the
  # VM disk under QEMU with KVM, the dashboard's port forwarded, and a run
  # that does not see the setup page answer within ten minutes fails here,
  # so appliance-publish never runs. What the lab suite adds (a pool and an
  # array on virtual disks, a share over SMB, a node and a container) lands
  # with the storage work, and the canary on the dev pair with it.
  appliance-boot:
    needs: appliance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: aerieos-os
          path: out
      - name: QEMU
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 ovmf mtools grub-common jq e2fsprogs fdisk
          sudo chmod a+rw /dev/kvm 2>/dev/null || true
      - name: Boot the image and wait for the dashboard
        shell: bash
        run: |
          set -euo pipefail
          qcow="$(find out -maxdepth 1 -name 'aerieos-os-*.qcow2' | head -1)"
          # A copy of the disk with the console on the serial line and the
          # initramfs tracing each step to it (aerie_args
          # in the ESP's grubenv, which the menu adds to the kernel line), so
          # what the initramfs and systemd say reaches serial.log; the disk
          # as shipped writes them to the screen.
          disk=boot.raw
          qemu-img convert -O raw "$qcow" "$disk"
          esp="$(sfdisk -J "$disk" | jq -r '.partitiontable.partitions[] | select(.name == "esp") | .start')"
          at="$disk@@$((esp * 512))"
          mcopy -n -i "$at" ::/grub/grubenv grubenv
          grub-editenv grubenv set aerie_args="console=ttyS0,115200 debug=vc loglevel=7"
          mcopy -o -i "$at" grubenv ::/grub/grubenv
          grub-editenv grubenv list
          kvm=""; [ -w /dev/kvm ] && kvm="-enable-kvm -cpu host"
          # shellcheck disable=SC2086
          qemu-system-x86_64 $kvm -m 4096 -smp 2 -machine q35 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive file="$disk",format=raw,if=virtio \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:7680-:7680 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:serial.log -daemonize -pidfile qemu.pid
          said="the dashboard did not answer within ten minutes"
          for i in $(seq 1 120); do
            code="$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:7680/ || true)"
            case "$code" in 200|302|303) echo "the dashboard answered $code after $((i * 5)) s"; kill "$(cat qemu.pid)" || true; exit 0 ;; esac
            # A panic is the answer: stop there rather than wait out the ten
            # minutes while the machine reboots into the same one.
            if grep -aq "end Kernel panic" serial.log 2>/dev/null; then said="the kernel panicked after $((i * 5)) s"; break; fi
            sleep 5
          done
          echo "$said; the first boot follows, and the serial log is the artifact"
          kill "$(cat qemu.pid)" || true
          # The first boot, from the firmware starting it to its first panic:
          # a failing boot reboots and repeats, so the log's end was the same
          # panic over and over; and with quiet there is no Linux version
          # line to cut at.
          tr -d '\r' < serial.log | sed 's/\x1b\[[0-9;=?]*[A-Za-z]//g' | grep -av '^[[:space:]]*$' > plain.log || true
          awk '/BdsDxe: starting/{n++} n==1{print} /end Kernel panic/{if(n==1)exit}' plain.log > first.log || true
          # No firmware line to cut at: the log's start, which is the first boot.
          [ -s first.log ] || head -n 400 plain.log > first.log
          tail -n 400 first.log
          exit 1
      # What only a stick does (B592) and a kept older version (R201): the same
      # disk booted with the slot in memory, the projects held; and booted once
      # from a version laid on the data partition, as an update leaves one, its
      # menu written by the agent's own code. Each must reach the dashboard and
      # say on the kernel's command line that it is what it was asked to be.
      - name: Boot it as a stick and from a kept version
        shell: bash
        run: |
          set -euo pipefail
          qcow="$(find out -maxdepth 1 -name 'aerieos-os-*.qcow2' | head -1)"
          name="$(basename "$qcow" .qcow2)"
          ver="${name#aerieos-os-}"
          kvm=""; [ -w /dev/kvm ] && kvm="-enable-kvm -cpu host"
          boot() {  # disk, log, the word its command line must carry
            # shellcheck disable=SC2086
            qemu-system-x86_64 $kvm -m 6144 -smp 2 -machine q35 \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive file="$1",format=raw,if=virtio \
              -netdev user,id=n0,hostfwd=tcp:127.0.0.1:7680-:7680 -device virtio-net-pci,netdev=n0 \
              -display none -serial file:"$2" -daemonize -pidfile qemu.pid
            for i in $(seq 1 120); do
              code="$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:7680/ || true)"
              case "$code" in
                200|302|303)
                  # The machine has to become its own node too, which takes a
                  # little longer than the dashboard: a failure is said on the serial line.
                  for _ in $(seq 1 24); do
                    if grep -aq "did not become its controller's node" "$2"; then
                      tail -c 3000 "$2"; echo "$3: the machine did not become its own node"; exit 1
                    fi
                    sleep 5
                  done
                  kill "$(cat qemu.pid)" || true; sleep 2
                  grep -aq "the root is in memory, $3" "$2" || {
                    echo "the dashboard answered, but this boot was not $3"
                    grep -a -E "AerieOS.*slot|in memory" "$2" | head -6 || true
                    tail -c 3000 "$2"
                    exit 1
                  }
                  echo "$3: the dashboard answered $code after $((i * 5)) s"; return 0 ;;
              esac
              if grep -aq "end Kernel panic" "$2" 2>/dev/null; then break; fi
              sleep 5
            done
            kill "$(cat qemu.pid)" || true
            tail -n 200 "$2"; echo "$3: no dashboard"; exit 1
          }
          env_set() {  # disk, settings for GRUB's environment
            local disk="$1" at; shift
            at="$disk@@$(( $(sfdisk -J "$disk" | jq -r '.partitiontable.partitions[] | select(.name == "esp") | .start') * 512 ))"
            mcopy -n -i "$at" ::/grub/grubenv grubenv
            grub-editenv grubenv set "$@" aerie_args="console=ttyS0,115200 loglevel=6"
            mcopy -o -i "$at" grubenv ::/grub/grubenv
            grub-editenv grubenv list
          }
          qemu-img convert -O raw "$qcow" stick.raw
          env_set stick.raw aerie_toram=1
          boot stick.raw serial-stick.log "aerietoram=1"
          rm -f stick.raw
          qemu-img convert -O raw "$qcow" kept.raw
          # Room on the data partition for a root, as a stick's first boot
          # grows it (p1 the BIOS partition, p2 the ESP, p5 the data).
          truncate -s +8G kept.raw
          sudo sfdisk --relocate gpt-bak-std kept.raw
          echo ", +" | sudo sfdisk -N 5 --no-reread kept.raw
          loop="$(sudo losetup -Pf --show kept.raw)"
          sudo e2fsck -fy "${loop}p5" || true
          sudo resize2fs "${loop}p5"
          sudo mkdir -p /mnt/bbdata /mnt/bbesp
          sudo mount "${loop}p5" /mnt/bbdata
          sudo mount "${loop}p2" /mnt/bbesp
          k=/mnt/bbdata/lib/aerieos-os/kept/kept-test
          sudo mkdir -p "$k"
          sudo cp "out/$name.root.squashfs" "$k/root.squashfs"
          sudo cp "out/$name.vmlinuz" "$k/vmlinuz"
          sudo cp "out/$name.initrd" "$k/initrd"
          sudo cp "out/$name.release" "$k/release"
          sudo env BB_OS_WORK=/mnt/bbdata/lib/aerieos-os BB_OS_ESP=/mnt/bbesp PYTHONPATH=scripts/agent \
            python3 -c 'from aerieos_agent.osimage import write_kept_menu, kept_list; assert [r["version"] for r in kept_list()] == ["kept-test"]; write_kept_menu()'
          sudo cat /mnt/bbesp/grub/kept.cfg
          sudo umount /mnt/bbdata /mnt/bbesp
          sudo losetup -d "$loop"
          env_set kept.raw aerie_kept_next=kept-test
          boot kept.raw serial-kept.log "aeriekept=kept-test"
          echo "kept and stick booted ($ver)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aerieos-os-boot
          path: serial*.log
          if-no-files-found: ignore
