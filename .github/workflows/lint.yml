name: lint

# On the pull request and nowhere else. Merging used to run this a second
# time, on the push to main that the merge creates, and that second run tells
# you nothing the first did not: a pull_request build checks out
# refs/pull/N/merge, which IS this branch merged into main: the same tree the
# button is about to produce. So the check happens once, before the decision it
# informs, rather than once before and once after.
#
# The one case it gives up: a commit pushed straight to main, bypassing a PR,
# is not linted. That is deliberate (work here lands on a branch and merges
# through a PR), and `aerie lint` in the container is the same set of tools if
# something ever does need checking by hand.
#
# ...and for a release's tag, called by build-image.yml before anything is
# built to publish (R206: nothing is published that this has not passed).
#
# What it runs is `aerie lint` itself, the checkout's, with nothing skipped,
# and the python unit tier. It ran its own copy of seven of aerie lint's
# checks (the audit of 13 Nov), so the docs checks, the layout, the pack
# formats and the rest held only where somebody ran them by hand, and no
# workflow ran the unit tier at all.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A superseded push's lint result is worthless, so cancel it rather than make
# the (single) self-hosted runner work through the backlog serially.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# To read the repository, and nothing else: a pull request's, or a tag's
# when its workflow calls this one.
permissions:
  contents: read

jobs:
  lint:
    # The AerieOS container itself, not ubuntu-latest: self-hosted minutes
    # are free where hosted ones bill against the plan, and the image bakes
    # the same linters `aerie lint` uses, so this job also proves, on every
    # push, that the runner picks up jobs and carries its advertised
    # toolchain. One job rather than one per tool because a single runner
    # serves jobs serially; splitting only adds queueing.
    #
    # The dashboard's browser suite used to be a step here and now has its own
    # workflow. It is the one check in this repo that fails for reasons that
    # are not the code's: it is timing-sensitive and this runner shares its
    # box with everything else. As a step it took these linters' verdict down
    # with it and stopped the compose and XML checks below from running at
    # all. Every tool in THIS job is deterministic, so a red run here means
    # something is genuinely wrong.
    # Not for a fork's pull request: this runner is a machine on its owner's
    # network and its jobs account reaches Docker there. This line stops a
    # fork's request that leaves the workflow as it is; one that changes the
    # workflow runs its own copy, so the protection that holds is the
    # repository's setting (Settings, Actions, General: require approval for
    # all external contributors) and reading a request's workflow changes
    # before approving its run. A request from a branch of this repository,
    # and a manual run, go on as before.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bb-sandbox]
    # `bash` rather than the default `bash -e`, because that one difference is
    # pipefail, and every check below is piped into tee. Without it the tee's
    # exit status is the step's, and a failing linter would report success.
    defaults:
      run:
        shell: bash
    steps:
      # Whole, with the tags: the agent's version is measured from the commit
      # that last moved it, and the shipped migrations against the newest
      # release's tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0

      - name: Open a log this container can read afterwards
        # The runner streams a step's console output to GitHub and keeps none
        # of it on disk: _diag under the runner's directory on its node
        # records which step failed and its exit code, never a line of what
        # it printed. So a session inside
        # this container, which has no PAT and cannot ask the API, could see
        # that CI was red and nothing about why, for a job that ran a few
        # inches away. Every check below tees into this file, and `aerie ci-log`
        # reads it.
        #
        # /config because it survives an image update; /tmp does not, and a
        # log that vanishes with the container is no use for the question
        # "what broke while I was away".
        run: |
          # Where the log is kept. On a node, BB_CI_LOG_DIR: the runner's
          # .env names the node's data store, which a session there can read
          # (the runner's own home is 0700 to it). Then /config on the
          # controller, because it survives an image update; the home is the
          # fallback. `aerie ci-log` resolves the same three in the same order,
          # and fetches across when the run was on a node.
          dir="${BB_CI_LOG_DIR:-}"
          if [ -z "$dir" ]; then
            if [ -w /config ]; then dir=/config/ci-logs; else dir="$HOME/ci-logs"; fi
          fi
          dir="$dir/${GITHUB_REPOSITORY##*/}"
          mkdir -p "$dir"
          log="$dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "CI_LOG=$log" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$dir" >> "$GITHUB_ENV"
          # One log a run: its first job writes the head `aerie ci-log` names
          # the run by, and each job after it (a tag's run has the lint, the
          # unit tier and the browser suites) adds its own part under it.
          if [ -s "$log" ]; then
            printf '\n== %s ==\n' "${GITHUB_JOB}" >> "$log"
          else
            {
              echo "# ${GITHUB_WORKFLOW} on ${GITHUB_REPOSITORY}"
              echo "run:    ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
              echo "event:  ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
              echo "commit: ${GITHUB_SHA}"
              echo "opened: $(date -Is)"
              echo
            } > "$log"
          fi

      - name: Ensure linters
        # The container the runner lives in can lag this repo: the PR that
        # first ADDS a tool to the image lints before any image carrying the
        # tool exists, and a stale container may not have updated yet. Fetch
        # whatever is missing into the job's temp dir. Never skip a check
        # because the tool is absent; that is a pass by omission.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          command -v shellcheck >/dev/null || \
            curl -fsSL https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz \
              | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/bin" shellcheck-stable/shellcheck
          command -v hadolint >/dev/null || {
            curl -fsSL -o "$RUNNER_TEMP/bin/hadolint" \
              https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x "$RUNNER_TEMP/bin/hadolint"
          }
          command -v actionlint >/dev/null || {
            # Tag via the /releases/latest redirect, not api.github.com:
            # anonymous API calls rate-limit per IP.
            tag="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/rhysd/actionlint/releases/latest)"
            tag="${tag##*/}"
            curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${tag}/actionlint_${tag#v}_linux_amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP/bin" actionlint
          }
          command -v ruff >/dev/null || {
            tag="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/astral-sh/ruff/releases/latest)"
            tag="${tag##*/}"
            curl -fsSL "https://github.com/astral-sh/ruff/releases/download/${tag}/ruff-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xz --strip-components=1 -C "$RUNNER_TEMP/bin" "ruff-x86_64-unknown-linux-gnu/ruff"
          }
          shellcheck --version | sed -n 2p
          hadolint --version
          actionlint --version
          ruff --version

      - name: What the checks compare against
        # main, for the agent's version, and the release tags, for the
        # migrations that shipped: a pull request's checkout has neither.
        run: |
          git fetch --no-tags --depth=1 origin main 2>&1 | tee -a "$CI_LOG" || true
          git fetch --tags --force origin 2>&1 | tee -a "$CI_LOG" || true

      - name: aerie lint
        # The checkout's own, on this runner and not relayed to a controller
        # (BB_RELAYED), with a missing tool a failure and never a skip
        # (BB_LINT_STRICT): one set of checks, the one a session runs before
        # it pushes, so passing there is passing here.
        env:
          BB_RELAYED: "1"
          BB_LINT_STRICT: "1"
        run: bash scripts/aerie lint 2>&1 | tee -a "$CI_LOG"

      - name: Close the log
        if: always()
        # Written whatever happened, because "it failed and said nothing" is
        # the case this exists for. Twenty runs kept: enough to compare a red
        # one against the green before it, few enough that /config does not
        # grow a year of them.
        run: |
          printf '\nresult: %s\nclosed: %s\n' "${{ job.status }}" "$(date -Is)" \
            >> "$CI_LOG"
          find "$CI_LOG_DIR" -maxdepth 1 -name '*.log' -printf '%T@ %p\n' \
            | sort -rn | tail -n +61 | cut -d' ' -f2- | xargs -r rm -f


  # The python unit tier (scripts/dashboard/unit): the modules' rules with no
  # server and no browser, under a minute. No workflow ran it: it held where
  # a session ran aerie tests unit before a push, and nowhere else.
  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bb-sandbox]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (B274)
        with:
          fetch-depth: 0

      - name: Open a log this container can read afterwards
        run: |
          dir="${BB_CI_LOG_DIR:-}"
          if [ -z "$dir" ]; then
            if [ -w /config ]; then dir=/config/ci-logs; else dir="$HOME/ci-logs"; fi
          fi
          dir="$dir/${GITHUB_REPOSITORY##*/}"
          mkdir -p "$dir"
          log="$dir/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "CI_LOG=$log" >> "$GITHUB_ENV"
          if [ -s "$log" ]; then
            printf '\n== %s ==\n' "${GITHUB_JOB}" >> "$log"
          else
            {
              echo "# ${GITHUB_WORKFLOW} on ${GITHUB_REPOSITORY}"
              echo "run:    ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
              echo "event:  ${GITHUB_EVENT_NAME}  ref: ${GITHUB_REF}"
              echo "commit: ${GITHUB_SHA}"
              echo "opened: $(date -Is)"
              echo
            } > "$log"
          fi

      - name: The unit tier
        env:
          BB_RELAYED: "1"
        run: bash scripts/aerie tests unit 2>&1 | tee -a "$CI_LOG"

      - name: Close the log
        if: always()
        run: |
          printf '\nresult: %s\nclosed: %s\n' "${{ job.status }}" "$(date -Is)" >> "$CI_LOG"
