# AerieOS (R160 step 1, R161 step 2): GRUB's menu on the ESP, the same
# file under UEFI and BIOS. Two root slots, A and B, each a squashfs on its
# own partition with its kernel and initrd under /aerieos/SLOT on the
# ESP; aerie_slot in grubenv (the slot tool's "next") names the one to boot,
# and the other is the entry under it. A slot written by an update boots on
# trial (aerie_trial=1, aerie_prev the slot before): each boot counts aerie_tries
# here, the health check marks the slot good (slot good) once the dashboard
# and the agent are up, and a third boot without that goes back to aerie_prev.
# panic=15 on every entry: a kernel or initramfs that panics restarts in
# fifteen seconds, so GRUB counts the boot and a trial goes back by itself
# rather than waiting at a shell on a machine with no screen (B471).
# Safe mode boots the slot with nothing but the dashboard and the shares
# (aeriesafe=1, which the held start reads).
set timeout=4
# The menu on a serial line as well as the screen, so a machine with no
# screen (a VM, a NAS's serial header, the CI boot test) shows it too.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
search --no-floppy --fs-uuid --set=root BB00-B007
if [ -s $prefix/grubenv ]; then
    load_env
fi
if [ -z "$aerie_slot" ]; then
    set aerie_slot=a
fi
if [ "$aerie_trial" = 1 ]; then
    if [ "$aerie_tries" = 2 ]; then
        # Two boots without the health check's word: back to the slot before.
        set aerie_slot="$aerie_prev"
        set aerie_trial=0
        set aerie_tries=0
        set aerie_fell_back=1
    elif [ "$aerie_tries" = 1 ]; then
        set aerie_tries=2
    else
        set aerie_tries=1
    fi
    save_env aerie_slot aerie_trial aerie_tries aerie_fell_back
fi
set default="slot-${aerie_slot}"
# One boot of a kept older version (This machine's Boot this next, R201): the
# word is spent here, so the boot after is the slot's again, and one that
# does not come up falls back by itself.
if [ -n "$aerie_kept_next" ]; then
    set default="older>kept-${aerie_kept_next}"
    set aerie_kept_next=
    save_env aerie_kept_next
fi
# A slot on trial whose kernel or initrd will not load goes to the slot
# before at once, not to GRUB's prompt (B471).
if [ "$aerie_trial" = 1 ]; then
    set fallback="slot-${aerie_prev}"
fi
# aerie_args in grubenv goes on the end of every entry's kernel line: a kernel
# argument a machine needs, or the console moved to the serial line (the
# last console= is the one the initramfs and systemd write to), which the
# CI boot test sets so a failing boot's own words reach its log.
# The USB edition (R161 step 1): with aerie_toram=1 in grubenv (the stick
# maker sets it) the slot is loaded into memory by the initramfs and the
# root is the copy, /dev/loop0; an installed disk boots the slot in place.
set root_a="root=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0a"
set root_b="root=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0b"
set ram=""
if [ "$aerie_toram" = 1 ]; then
    set root_a="root=/dev/loop0 bbslotdev=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0a aerietoram=1"
    set root_b="root=/dev/loop0 bbslotdev=PARTUUID=6a5c2f3e-0b7d-4b2a-9c1e-b0b1de5b0e0b aerietoram=1"
    set ram=" (in memory)"
fi
if [ -n "$aerie_ver_a" ]; then set name_a="AerieOS $aerie_ver_a, slot A"; else set name_a="AerieOS, slot A"; fi
if [ -n "$aerie_ver_b" ]; then set name_b="AerieOS $aerie_ver_b, slot B"; else set name_b="AerieOS, slot B"; fi
menuentry "$name_a$ram" --id slot-a {
    linux /aerieos/a/vmlinuz $root_a rootfstype=squashfs overlayroot=tmpfs aerieslot=a panic=15 console=ttyS0,115200 console=tty0 quiet systemd.show_status=auto $aerie_args
    initrd /aerieos/a/initrd
}
menuentry "$name_b$ram" --id slot-b {
    linux /aerieos/b/vmlinuz $root_b rootfstype=squashfs overlayroot=tmpfs aerieslot=b panic=15 console=ttyS0,115200 console=tty0 quiet systemd.show_status=auto $aerie_args
    initrd /aerieos/b/initrd
}
if [ "$aerie_slot" = b ]; then set safe_root="$root_b"; set safe_slot=b; else set safe_root="$root_a"; set safe_slot=a; fi
menuentry "Safe mode: the dashboard and the shares, nothing else started" --id safe {
    linux /aerieos/$safe_slot/vmlinuz $safe_root rootfstype=squashfs overlayroot=tmpfs aerieslot=$safe_slot aeriesafe=1 panic=15 console=ttyS0,115200 console=tty0 systemd.show_status=auto $aerie_args
    initrd /aerieos/$safe_slot/initrd
}
# A way in at the screen when nothing else answers (R194, the operator, 1
# Nov): systemd's rescue target, its shell given without a password since
# root has none (SYSTEMD_SULOGIN_FORCE); nothing else is started. Whoever is
# at the keyboard can already take the disks out, so it opens nothing they
# do not have. Never the default: it is picked here.
menuentry "Rescue: a root shell at this screen, nothing started" --id rescue {
    linux /aerieos/$safe_slot/vmlinuz $safe_root rootfstype=squashfs overlayroot=tmpfs aerieslot=$safe_slot aeriesafe=1 panic=15 console=ttyS0,115200 console=tty0 systemd.unit=rescue.target systemd.setenv=SYSTEMD_SULOGIN_FORCE=1 $aerie_args
    initrd /aerieos/$safe_slot/initrd
}
# The older versions kept on the data partition (R201): the agent writes this
# file as it keeps and removes them; each boots from its files there.
if [ -s $prefix/kept.cfg ]; then
    source $prefix/kept.cfg
fi
