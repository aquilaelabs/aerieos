# The NVIDIA driver in the image takes the card (R207): nouveau, the kernel's
# own, is kept off it, since the two cannot share one and nouveau's hold had
# the first boot on a server poke the card with no driver to use it. A card
# given to a VM is bound to vfio-pci before either, by its ids in
# aerieos-gpu-vm.conf beside this file, which This machine's Features writes.
blacklist nouveau
options nouveau modeset=0
softdep nvidia pre: vfio-pci
softdep nouveau pre: vfio-pci
