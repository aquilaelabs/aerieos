# A pool in zpool.cache is one this machine made or imported, and an image
# before the host id was kept had its own: without -f the first boot of an
# update refused them all as another system's. In ExecStart, since
# /etc/default/zfs sets the service's ZPOOL_IMPORT_OPTS empty.
[Service]
ExecStart=
ExecStart=/usr/sbin/zpool import -c /etc/zfs/zpool.cache -aN -f
