# The ISO's menu: the same kernel, initrd and root squashfs the disk carries,
# booted live (live-boot finds live/filesystem.squashfs on the medium). This
# file is what a machine already running AerieOS updates from; it is not
# offered as an installer (the operator, 11 Nov): a new machine is set up from
# the USB edition until the installer on the machine's own screen is built.
# So nothing starts by itself, the one entry that boots says nothing is kept,
# and the other says where a new machine starts. The console installer is
# still in the image (bbinstaller=1 on the kernel's line starts it), for the
# build's own check that the ISO lays a disk out and for what replaces it.
set timeout=-1
set default=0
menuentry "Run AerieOS from this medium: nothing is installed, nothing is kept" {
    linux /live/vmlinuz boot=live components quiet systemd.show_status=auto
    initrd /live/initrd
}
menuentry "A new machine is set up from the USB edition: aerieos.org" {
    true
}
